server:
  port: ${PORT:8080}

spring:

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect

    hibernate:
      ddl-auto: validate

    show-sql: false

springdoc:

  swagger-ui:
    enabled: false

  api-docs:
    enabled: false

app:

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:30}