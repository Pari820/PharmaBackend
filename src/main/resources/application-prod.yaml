# ==========================================
# PHARMABACKEND - PERFIL PRODUCCION
# PRACTICA 13
# ==========================================

server:
  port: ${PORT:8080}

# ==========================================
# SPRING BOOT
# ==========================================

spring:

  # ORACLE - CREDENCIALES POR VARIABLES
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # FLYWAY
  flyway:
    enabled: true
    locations: classpath:db/migration

  # JPA - PRODUCCION
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect

    hibernate:
      ddl-auto: validate

    show-sql: false
    open-in-view: false

# ==========================================
# SWAGGER DESACTIVADO EN PRODUCCION
# ==========================================

springdoc:
  swagger-ui:
    enabled: false

  api-docs:
    enabled: false

# ==========================================
# CORS Y SEGURIDAD JWT
# ==========================================

app:

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_ORIGINS:http://localhost:8081}}

  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:30}

# ==========================================
# LOGS DE PRODUCCION
# ==========================================

logging:

  file:
    name: logs/pharma-backend.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14

  pattern:
    console: "%d %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d %-5level [%X{requestId}] %logger{36} - %msg%n"
